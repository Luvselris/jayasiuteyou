<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard ♡ Jayasiuteyou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #f4f4f7;
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-color: #e5e5ea;
      --accent-dark: #1c1c1e;
      --text-main: #2c2c2e;
      --text-muted: #8e8e93;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', 'Mitr', sans-serif; }
    body {
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg-color) 60%, #e5e5ea 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 480px; }
    #loginView { min-height: 75vh; display: flex; flex-direction: column; justify-content: center; }
    .login-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border-color);
      text-align: center;
    }
    .input-field, .textarea-field {
      width: 100%; padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 16px; font-size: 13.5px;
      background: #fff; color: var(--text-main);
      outline: none; margin-bottom: 12px;
    }
    .btn-dark {
      width: 100%;
      background: linear-gradient(135deg, #48484a, var(--accent-dark));
      color: #fff; border: none; padding: 13px;
      border-radius: 20px; font-size: 14px;
      font-weight: 600; cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }
    .btn-outline {
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      color: var(--accent-dark);
      padding: 8px 16px; border-radius: 16px;
      font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    #dashboardView { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .panel-card {
      background: var(--card-bg);
      border-radius: 24px; padding: 20px 16px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border-color);
      margin-bottom: 18px;
    }
    .panel-title {
      font-size: 15px; font-weight: 700;
      color: var(--accent-dark); margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hl-admin-card {
      background: #fff; border: 1px solid var(--border-color);
      border-radius: 18px; padding: 14px; margin-bottom: 14px;
    }
    .stories-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-top: 10px;
    }
    .story-slot {
      position: relative; aspect-ratio: 1;
      border-radius: 12px; border: 1px dashed var(--border-color);
      overflow: hidden; background: #f8f8fa;
      display: flex; align-items: center; justify-content: center;
    }
    .story-slot img { width: 100%; height: 100%; object-fit: cover; }
    .del-btn {
      position: absolute; top: 2px; right: 2px;
      background: rgba(44, 44, 46, 0.85); color: #fff;
      border: none; border-radius: 50%;
      width: 20px; height: 20px; font-size: 11px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginView">
      <div class="login-card">
        <h2 style="color:var(--accent-dark); margin-bottom:20px;">Admin Login ♡</h2>
        <form onsubmit="handleLogin(event)">
          <input type="email" id="emailInput" class="input-field" placeholder="siriwimon6303@gmail.com" required>
          <input type="password" id="passwordInput" class="input-field" placeholder="140548" required>
          <button type="submit" class="btn-dark">เข้าสู่ระบบ ✨</button>
          <p id="loginError" style="color:#ff3b30; font-size:12px; margin-top:10px; display:none;">อีเมลหรือรหัสผ่านไม่ถูกต้องค่ะ</p>
        </form>
      </div>
    </div>

    <div id="dashboardView">
      <div class="top-bar">
        <div style="font-weight:700; color:var(--accent-dark); font-size:18px;">Dashboard ♡ Jayasiuteyou</div>
        <button onclick="handleLogout()" class="btn-outline">ออกระบบ</button>
      </div>

      <div class="panel-card">
        <div class="panel-title"><span>🎀 ข้อมูลร้านและรูปภาพ</span></div>
        <input type="text" id="storeNameInput" class="input-field" placeholder="Jayasiuteyou">
        <textarea id="storeBioInput" class="textarea-field" rows="4" placeholder="ข้อความแนะนำร้าน..."></textarea>
        
        <div style="margin-bottom:12px;">
          <label style="font-size:12px; color:var(--text-muted); font-weight:600; display:block; margin-bottom:4px;">รูปแบนเนอร์:</label>
          <input type="file" accept="image/*" onchange="uploadDirect(event, 'bannerImg')">
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:12px; color:var(--text-muted); font-weight:600; display:block; margin-bottom:4px;">รูปโปรไฟล์:</label>
          <input type="file" accept="image/*" onchange="uploadDirect(event, 'profileImg')">
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-title"><span>🔗 ข้อมูลการติดต่อ & เพลง</span></div>
        <input type="url" id="lineUrlInput" class="input-field" placeholder="https://line.me/ti/p/_HeqXP_hLu">
        <input type="url" id="discordUrlInput" class="input-field" placeholder="https://discord.gg/ReEeJqNCmA">
        <input type="url" id="musicUrlInput" class="input-field" placeholder="ใส่ลิงก์ไฟล์เสียง .mp3">
      </div>

      <div class="panel-card">
        <div class="panel-title"><span>📝 รายละเอียดร้าน (Details)</span></div>
        <textarea id="detailsInput" class="textarea-field" rows="5" placeholder="รายละเอียดบริการ..."></textarea>
      </div>

      <div class="panel-card">
        <div class="panel-title">
          <span>✨ ไฮไลท์สตอรี่ (เพิ่มได้ไม่จำกัด)</span>
          <button type="button" class="btn-outline" style="padding:4px 10px; font-size:11px;" onclick="addNewHighlight()">+ เพิ่มไฮไลท์ใหม่</button>
        </div>
        <div id="hlAdminList"></div>
      </div>

      <button type="button" class="btn-dark" id="saveBtn" style="font-size:15px; padding:14px; margin-bottom:20px;" onclick="saveAll()">
        ☁️ บันทึกขึ้นระบบทันที (หน้าเว็บเปลี่ยนสด) ♡
      </button>

      <div class="panel-card">
        <div class="panel-title"><span>💬 จัดการรีวิวจากลูกค้า</span></div>
        <div id="reviewsBox"></div>
      </div>
    </div>
  </div>

  <script>
    const AUTH_EMAIL = "siriwimon6303@gmail.com";
    const AUTH_PASS = "140548";

    const DB_CONFIG = "jayasiuteyou_config";
    const DB_HL = "jayasiuteyou_highlights";
    const DB_REVIEWS = "jayasiuteyou_reviews";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let siteConfig = {
      siteTitle: "Jayasiuteyou ♡",
      storeName: "Jayasiuteyou",
      storeBio: "welcome to jayasiuteyou ♡\nรับกดกรอบป้ายชื่อเอฟเฟค discord\nรับส่งสติ๊กเกอร์ อีโมจิ ธีม เมโลดี้ ♡",
      bannerImg: "",
      profileImg: "",
      lineUrl: "https://line.me/ti/p/_HeqXP_hLu",
      discordUrl: "https://discord.gg/ReEeJqNCmA",
      musicUrl: "",
      details: "รับกด กรอบ ป้ายชื่อ เอฟเฟกต์ discord เริ่มต้น 40.-\nรับส่งสติ๊กִเกอׂร์ ธีมִ\nเׂมโลִดี้ อีโมจิ\nและอื่นๆที่ได้เงิน ♡"
    };

    let highlightsList = [];

    window.onload = function() {
      if (sessionStorage.getItem('jayasiuteyou_auth') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const mail = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      if (mail === AUTH_EMAIL && pass === AUTH_PASS) {
        sessionStorage.setItem('jayasiuteyou_auth', 'true');
        showDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('jayasiuteyou_auth');
      location.reload();
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      try {
        const doc = await db.collection(DB_CONFIG).doc("main").get();
        if (doc.exists) siteConfig = { ...siteConfig, ...doc.data() };
        
        const hlSnap = await db.collection(DB_HL).orderBy("order", "asc").get();
        highlightsList = [];
        hlSnap.forEach(d => {
          highlightsList.push({ id: d.id, ...d.data() });
        });
      } catch (err) {}

      renderFields();
      listenReviews();
    }

    function renderFields() {
      document.getElementById('storeNameInput').value = siteConfig.storeName || '';
      document.getElementById('storeBioInput').value = siteConfig.storeBio || '';
      document.getElementById('lineUrlInput').value = siteConfig.lineUrl || '';
      document.getElementById('discordUrlInput').value = siteConfig.discordUrl || '';
      document.getElementById('musicUrlInput').value = siteConfig.musicUrl || '';
      document.getElementById('detailsInput').value = siteConfig.details || '';
      renderHighlightsAdmin();
    }

    function renderHighlightsAdmin() {
      const box = document.getElementById('hlAdminList');
      box.innerHTML = '';

      if (highlightsList.length === 0) {
        box.innerHTML = '<p style="font-size:12px; color:var(--text-muted); padding:10px 0;">ยังไม่มีไฮไลท์ กดปุ่ม "+ เพิ่มไฮไลท์ใหม่" ได้เลยค่ะ</p>';
        return;
      }

      highlightsList.forEach((hl, idx) => {
        const card = document.createElement('div');
        card.className = 'hl-admin-card';

        let imgsHtml = '';
        if (hl.images) {
          hl.images.forEach((img, imgIdx) => {
            imgsHtml += `
              <div class="story-slot">
                <img src="${img}">
                <button class="del-btn" onclick="removeStoryImg(${idx}, ${imgIdx})">✕</button>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div style="font-weight:700; color:var(--accent-dark); font-size:13.5px;">ไฮไลท์ที่ ${idx + 1}</div>
            <button onclick="removeHighlight(${idx})" style="background:none; border:none; color:#ff3b30; font-size:12px; cursor:pointer;">ลบไฮไลท์นี้ 🗑️</button>
          </div>
          <input type="text" class="input-field" value="${hl.title || ''}" placeholder="ชื่อไฮไลท์" onchange="highlightsList[${idx}].title = this.value">
          
          <div style="font-size:12px; margin-bottom:6px; color:var(--text-muted);">
            เปลี่ยนรูปปก: <input type="file" accept="image/*" onchange="uploadCover(event, ${idx})">
          </div>
          <div style="font-size:12px; margin-bottom:6px; color:var(--text-muted);">
            + เพิ่มรูปสตอรี่: <input type="file" accept="image/*" multiple onchange="uploadStoryImgs(event, ${idx})">
          </div>
          <div class="stories-grid">${imgsHtml}</div>
        `;
        box.appendChild(card);
      });
    }

    function addNewHighlight() {
      highlightsList.push({
        title: `Highlight ${highlightsList.length + 1}`,
        cover: "",
        images: [],
        order: highlightsList.length
      });
      renderHighlightsAdmin();
    }

    async function removeHighlight(idx) {
      if (confirm(`ต้องการลบไฮไลท์ที่ ${idx + 1} ใช่หรือไม่?`)) {
        const item = highlightsList[idx];
        if (item.id) {
          await db.collection(DB_HL).doc(item.id).delete();
        }
        highlightsList.splice(idx, 1);
        renderHighlightsAdmin();
      }
    }

    // ปรับให้ขนาดภาพกะทัดรัด คมชัดบนจอ Retina และไม่เปลืองเนื้อที่
    function compressImg(file, maxWidth = 640, quality = 0.68) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadDirect(e, key) {
      if (e.target.files && e.target.files[0]) {
        siteConfig[key] = await compressImg(e.target.files[0], 600, 0.7);
      }
    }

    async function uploadCover(e, idx) {
      if (e.target.files && e.target.files[0]) {
        highlightsList[idx].cover = await compressImg(e.target.files[0], 250, 0.7);
      }
    }

    async function uploadStoryImgs(e, idx) {
      const files = Array.from(e.target.files);
      if (!highlightsList[idx].images) highlightsList[idx].images = [];
      for (const f of files) {
        const b64 = await compressImg(f, 640, 0.68);
        highlightsList[idx].images.push(b64);
      }
      renderHighlightsAdmin();
    }

    function removeStoryImg(hlIdx, imgIdx) {
      highlightsList[hlIdx].images.splice(imgIdx, 1);
      renderHighlightsAdmin();
    }

    async function saveAll() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = "กำลังบันทึกข้อมูล... ⏳";

      siteConfig.storeName = document.getElementById('storeNameInput').value;
      siteConfig.storeBio = document.getElementById('storeBioInput').value;
      siteConfig.lineUrl = document.getElementById('lineUrlInput').value.trim();
      siteConfig.discordUrl = document.getElementById('discordUrlInput').value.trim();
      siteConfig.musicUrl = document.getElementById('musicUrlInput').value.trim();
      siteConfig.details = document.getElementById('detailsInput').value;

      try {
        // เซฟข้อมูลร้านหลัก
        await db.collection(DB_CONFIG).doc("main").set(siteConfig);

        // แยกเซฟไฮไลท์แต่ละอันเป็นคนละ Document หมดปัญหาเต็ม 1 MB แน่นอน
        for (let i = 0; i < highlightsList.length; i++) {
          const hl = highlightsList[i];
          const hlData = {
            title: hl.title || `Highlight ${i + 1}`,
            cover: hl.cover || (hl.images && hl.images[0]) || "",
            images: hl.images || [],
            order: i
          };
          if (hl.id) {
            await db.collection(DB_HL).doc(hl.id).set(hlData);
          } else {
            const docRef = await db.collection(DB_HL).add(hlData);
            hl.id = docRef.id;
          }
        }

        alert("✨ บันทึกข้อมูลสำเร็จเรียบร้อยแล้วค่ะ!");
      } catch (err) {
        console.error(err);
        alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง");
      } finally {
        btn.disabled = false;
        btn.textContent = "☁️ บันทึกขึ้นระบบทันที (หน้าเว็บเปลี่ยนสด) ♡";
      }
    }

    function listenReviews() {
      db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snap => {
        const box = document.getElementById('reviewsBox');
        box.innerHTML = '';
        if (snap.empty) {
          box.innerHTML = '<p style="text-align:center; font-size:12px; color:var(--text-muted);">ยังไม่มีรีวิว</p>';
          return;
        }
        snap.forEach(doc => {
          const d = doc.data();
          const div = document.createElement('div');
          div.style = "background:#fff; border:1px solid var(--border-color); border-radius:14px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;";
          div.innerHTML = `
            <div>
              <div style="font-weight:700; font-size:13px;">${d.name} (${'★'.repeat(d.stars || 5)})</div>
              <div style="font-size:12px; color:var(--text-muted);">${d.msg}</div>
            </div>
            <button onclick="deleteReview('${doc.id}')" style="background:#f2f2f7; border:none; color:#ff3b30; padding:4px 8px; border-radius:8px; font-size:11px; cursor:pointer;">ลบ</button>
          `;
          box.appendChild(div);
        });
      });
    }

    async function deleteReview(id) {
      if (confirm("ต้องการลบรีวิวนี้ใช่หรือไม่?")) {
        await db.collection(DB_REVIEWS).doc(id).delete();
      }
    }
  </script>
</body>
</html>
